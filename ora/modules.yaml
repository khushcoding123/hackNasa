# ORA node module catalogue.
#
# PLACEHOLDER VALUES. Mass (kg) and power (W, positive = draw) are illustrative figures chosen
# only so the configurator can total a parts list and report what a module swap costs. None is
# taken from a datasheet. Replace every number before it goes on a slide.
core:                 {mass_kg: 2.0, power_w: 1.0, role: "computer, clock and mesh radio"}
"power:solar+battery": {mass_kg: 6.0, power_w: 0.0, role: "panel and battery for sunlit sites"}
"power:battery":       {mass_kg: 8.0, power_w: 0.0, role: "larger battery for dark sites"}
"power:laser_receiver": {mass_kg: 3.0, power_w: 0.0, role: "tuned photovoltaic receiver for beamed power"}
"thermal:insulation":  {mass_kg: 1.0, power_w: 0.0, role: "multi-layer insulation"}
"thermal:phase_change": {mass_kg: 2.5, power_w: 0.0, role: "phase-change buffer for long darkness"}
"antenna:omni":        {mass_kg: 0.5, power_w: 2.0, role: "omnidirectional RF"}
"antenna:directional": {mass_kg: 3.0, power_w: 8.0, role: "steerable dish toward Earth"}
"antenna:optical":     {mass_kg: 4.0, power_w: 6.0, role: "optical terminal for trunk links"}
"anchor:regolith_spike": {mass_kg: 1.0, power_w: 0.0, role: "spike for soft regolith"}
"anchor:rock_bolt":    {mass_kg: 2.0, power_w: 0.0, role: "bolt for rock or steep ground"}
"dust:shield":         {mass_kg: 1.5, power_w: 0.5, role: "dust cover and electrostatic shield"}
"shock:isolated_mount": {mass_kg: 2.0, power_w: 0.0, role: "shock mount for blast zones"}
