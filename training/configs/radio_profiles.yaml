# Normalized surface-link fields. Sensitivity is at the app's 128 kbps reference rate.
moonmesh_2p4_ref:
  frequency_ghz: 2.4 # moonmesh/models.py:40, surface_radio.ghz
  tx_power_dbm: 33.01029995663981 # moonmesh/models.py:40, watts=2; 30 + 10*log10(2)
  tx_gain_dbi: 4 # moonmesh/models.py:40, surface_radio.tx_gain
  rx_gain_dbi: 4 # moonmesh/models.py:40, surface_radio.rx_gain
  fixed_loss_db: 3 # moonmesh/models.py:40, surface_radio.loss
  receiver_sensitivity_dbm: -105 # moonmesh/models.py:40, surface_radio.sensitivity
  required_margin_db: 3 # moonmesh/models.py:40, surface_radio.margin
  max_range_m: 8000 # moonmesh/models.py:27, deployment_km=8; 8 * 1000

lunarrf_1p8:
  frequency_ghz: 1.8 # radio_params.json: frequencies_hz[0] / 1e9
  tx_power_dbm: 30.0 # radio_params.json: tx_power_dbm
  tx_gain_dbi: 0.0 # radio_params.json: tx_gain_dbi
  rx_gain_dbi: 0.0 # radio_params.json: rx_gain_dbi
  fixed_loss_db: 0 # Documented assumption: radio_params.json budget lists no fixed/system loss.
  receiver_sensitivity_dbm: -94.40475498807768 # radio_params.json: rx_sensitivity_dbm
  required_margin_db: 0 # Documented assumption: radio_params.json budget.snr_required_db=0; stats_exact/disc_exact.json threshold equals sensitivity.
  max_range_m: 22040 # radio_params.json: max_radius_m
# Source above: interim/lunarrf/meta/atlas_v2/bundle/ (see reports/lunarrf_findings.md).
