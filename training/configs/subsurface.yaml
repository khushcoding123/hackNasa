# Underground-station -> surface-station radio link through lunar rock and regolith.
# ALL labels from this config are SIMULATED (deterministic physics), not measurements.
seed: 42
output: reports/subsurface
# Fixed link hardware. Placeholder values, not a real radio: no hardware spec exists in this repo for a
# through-rock link. TODO: replace with the real subsurface radio once chosen.
radio:
  tx_power_dbm: 30.0
  tx_gain_dbi: 2.0
  rx_gain_dbi: 2.0
  receiver_sensitivity_dbm: -105.0
  required_margin_db: 3.0
# Material models. status explains how well each value is sourced.
materials:
  regolith:
    # Carrier, Olhoeft, Mendell (1991) Lunar Sourcebook ch. 9, as recalled:
    #   eps' = 1.919**density_g_cc ; tan_delta = 10**(0.038*(FeO+TiO2 wt%) + 0.312*density - 3.260)
    # TODO: confirm both formulas against the Sourcebook text before quoting results.
    status: literature_recalled_unverified
    density_g_cc: [1.3, 2.0]
    feo_tio2_wt_pct: [5.0, 25.0]
  basalt:
    # Solid mare-basalt range as recalled from Apollo sample measurements. TODO: verify and cite.
    # Treated as an assumed range; the model is trained across it, so it is an input, not a constant.
    status: assumed_range_unverified
    eps_real: [6.0, 9.0]
    tan_delta: [0.003, 0.03]
# Scenario sampling ranges (training distribution) and out-of-range test ranges.
sampling:
  n_train: 20000
  frequency_ghz: [0.4, 0.9, 2.4, 5.8]
  regolith_thickness_m: [0.5, 15.0]
  basalt_thickness_m: [0.0, 40.0]   # solid rock between tube roof and regolith base; 0 = tube roof is regolith
  horizontal_offset_m: [0.0, 100.0]
  # Held-out extrapolation test: thicker overburden than anything in training.
  extrapolation_basalt_thickness_m: [40.0, 80.0]
split_fractions: {train: 0.7, val: 0.15, test: 0.15}
model:
  n_estimators: 600
  learning_rate: 0.05
  num_leaves: 63
