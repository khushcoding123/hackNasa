[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moonmesh-workspace"
version = "0.1.0"
description = "MOONMESH deterministic engine and terrain coverage training workspace"
requires-python = ">=3.11"
# Dependencies remain in requirements.txt and requirements-training.txt.
dependencies = []

[tool.setuptools]
packages = ["moonmesh", "lunar_core", "moonmesh_train"]
include-package-data = false

[tool.setuptools.package-dir]
moonmesh = "moonmesh"
lunar_core = "lunar_core"
moonmesh_train = "training/src/moonmesh_train"
