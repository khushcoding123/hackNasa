# Render Blueprint: builds the Dockerfile and redeploys on every push to main.
services:
  - type: web
    name: moonmesh
    runtime: docker
    plan: standard        # 2 GB RAM; coverage/ML jobs need more than the free 512 MB
    branch: main
    autoDeploy: true
    healthCheckPath: /api/config
    envVars:
      - key: MOONMESH_DATA_ROOT
        value: /app/data
