; ORA bench test. Build and flash with:  pio run -e node1 -t upload
; One environment per board so each gets its own NODE_ID.
[env]
platform = espressif32@6
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:node1]
build_flags = -DNODE_ID=1

[env:node2]
build_flags = -DNODE_ID=2

[env:node3]
build_flags = -DNODE_ID=3

[env:node4]
build_flags = -DNODE_ID=4
